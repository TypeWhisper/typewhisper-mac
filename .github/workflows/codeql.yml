name: CodeQL

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    tags:
      - "v*"
      - "!v*-daily*"
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: "26 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

env:
  SCHEME: TypeWhisper
  PROJECT: TypeWhisper.xcodeproj

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
            timeout-minutes: 10
          - language: python
            build-mode: none
            runner: ubuntu-latest
            timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  # Runs on every trigger, including pull requests and the weekly default-branch scan.
  # Builds the app and every plugin target; see docs/codeql-swift.md.
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODE_VERSION: "26.6"
      # The coverage check below reads per-file extraction diagnostics, which the
      # CodeQL Action skips on pull requests by default since v4.33.0.
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Package checkouts only, never compiled artifacts: every Swift file must be
      # compiled under CodeQL tracing to be extracted.
      - name: Restore Swift package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      # Resolve before CodeQL initialization; package checkouts are slow under tracing.
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if xcodebuild -resolvePackageDependencies \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      # CodeQL tracing can change Metal toolchain visibility on macOS 26.
      # Check from the traced process environment, after init, before compiling MLX.
      - name: Verify Metal toolchain after CodeQL initialization
        run: |
          if ! xcrun metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
          xcrun metal -v

      # Under CodeQL tracing, the `metal` stub in Xcode's default toolchain reports a
      # missing Metal Toolchain, while the downloaded toolchain's `metal` works. A
      # one-tool toolchain that forwards to it lets the MLX plugins build.
      - name: Route Metal compiles to the downloaded Metal toolchain
        id: metal-toolchain
        run: |
          metal="$(xcrun --find metal)"
          toolchain="$HOME/Library/Developer/Toolchains/CodeQLMetal.xctoolchain"
          identifier="com.typewhisper.codeql-metal"
          mkdir -p "$toolchain/usr/bin"
          cat > "$toolchain/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>$identifier</string>
            <key>DisplayName</key>
            <string>CodeQL Metal</string>
            <key>CompatibilityVersion</key>
            <integer>2</integer>
          </dict>
          </plist>
          PLIST
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$metal" > "$toolchain/usr/bin/metal"
          chmod +x "$toolchain/usr/bin/metal"
          plutil -lint "$toolchain/Info.plist"
          cat "$toolchain/usr/bin/metal"
          echo "identifier=$identifier" >> "$GITHUB_OUTPUT"

      - name: Build Swift for CodeQL
        env:
          SOURCE_PACKAGES_DIR: ${{ runner.temp }}/SourcePackages
          TOOLCHAINS: ${{ steps.metal-toolchain.outputs.identifier }}
        run: |
          set -o pipefail
          bash scripts/codeql-build-swift.sh "$RUNNER_TEMP/codeql-build" | tee "$RUNNER_TEMP/codeql-swift-build.log"

      # Upload only after the coverage check, so a partial extraction cannot make
      # alerts in skipped files look fixed.
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:swift"
          upload: never

      - name: Check Swift extraction coverage
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 scripts/codeql_swift_coverage.py "$SARIF_DIR/swift.sarif"

      - name: Upload CodeQL Swift results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}/swift.sarif
          category: "/language:swift"

      - name: Upload CodeQL Swift diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-swift-diagnostics
          path: |
            ${{ runner.temp }}/codeql-swift-build.log
            ${{ runner.temp }}/codeql_databases/log
            ${{ runner.temp }}/codeql_databases/swift/log
            ${{ runner.temp }}/codeql_databases/swift/diagnostic
            ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: ignore
          retention-days: 7
