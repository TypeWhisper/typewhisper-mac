name: Build DMG

on:
  # Pull requests cover feature branches; pushes only build maintained release branches.
  push:
    branches: ['release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  SCHEME: TypeWhisper
  PROJECT: TypeWhisper.xcodeproj
  XCODE_VERSION: "26.6"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit's first parent is the base branch.
          fetch-depth: 2

      - name: Check whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD

      - name: Run script and policy checks
        run: bash scripts/ci-checks.sh

      - name: Check dependency coverage
        run: |
          ruby scripts/dependency_coverage.rb check
          ruby scripts/test_dependency_coverage.rb

  release-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore Swift package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if xcodebuild -resolvePackageDependencies \
              -project $PROJECT \
              -scheme $SCHEME \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Verify Release Check Scripts
        run: |
          bash scripts/check_release_binary_instrumentation.sh --self-test
          bash scripts/check_release_signing.sh --self-test

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild -skipPackagePluginValidation -project $PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination 'generic/platform=macOS' \
            ENABLE_CODE_COVERAGE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee build.log

      - name: Check First-Party Warnings
        run: bash scripts/check_first_party_warnings.sh build.log

      - name: Check Release Binary Instrumentation
        run: bash scripts/check_release_binary_instrumentation.sh build/Build/Products/Release/TypeWhisper.app/Contents/MacOS/typewhisper-cli

      - name: Install dmgbuild
        run: |
          VENV_DIR="${RUNNER_TEMP}/dmgbuild-venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install dmgbuild
          echo "$VENV_DIR/bin" >> $GITHUB_PATH

      - name: Create DMG
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_NAME="TypeWhisper"
          DMG_NAME="TypeWhisper-${SHORT_SHA}.dmg"
          APP_PATH="build/Build/Products/Release/TypeWhisper.app"
          SETTINGS="${GITHUB_WORKSPACE}/.github/dmgbuild-settings.py"
          BACKGROUND="${GITHUB_WORKSPACE}/.github/dmg-background.png"

          dmgbuild -s "$SETTINGS" \
            -D app="$APP_NAME" \
            -D app_path="$APP_PATH" \
            -D background="$BACKGROUND" \
            "$APP_NAME" \
            "build/${DMG_NAME}"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TypeWhisper-DMG
          path: build/TypeWhisper-*.dmg
          retention-days: 14

  app-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # This job owns the cache save so the parallel release build does not race it.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if xcodebuild -resolvePackageDependencies \
              -project $PROJECT \
              -scheme $SCHEME \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Run App Tests
        run: |
          set -o pipefail
          xcodebuild test -skipPackagePluginValidation -project $PROJECT \
            -scheme $SCHEME \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Check First-Party Warnings
        run: bash scripts/check_first_party_warnings.sh test.log

  plugin-sdk-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Run Plugin SDK Tests
        run: swift test --package-path TypeWhisperPluginSDK

  # Mac App Store edition: sandboxed APPSTORE build with bundled plugins.
  # See docs/appstore/README.md.
  appstore:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPSTORE_DERIVED_DATA: build/appstore
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate App Store project
        run: scripts/appstore/generate_project.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/AppStoreSourcePackages
          key: appstore-spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('appstore-project.yml', 'TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'TypeWhisperPluginSDK/Package.resolved') }}
          restore-keys: |
            appstore-spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Build universal App Store app (unsigned)
        run: |
          mkdir -p build
          if ! xcodebuild build \
            -project TypeWhisperAppStore.xcodeproj \
            -scheme TypeWhisperAppStore \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$APPSTORE_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/AppStoreSourcePackages" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build/appstore-xcodebuild.log 2>&1; then
            grep -E ' error: ' build/appstore-xcodebuild.log | sort -u | head -50
            tail -n 40 build/appstore-xcodebuild.log
            exit 1
          fi
          tail -n 3 build/appstore-xcodebuild.log

      - name: Audit App Store boundary
        run: |
          scripts/appstore/audit_app_store_binary.sh \
            --allow-unsigned \
            --require-universal \
            "$APPSTORE_DERIVED_DATA/Build/Products/Release/TypeWhisper.app"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstore-xcodebuild-log
          path: build/appstore-xcodebuild.log
          retention-days: 7

  # Single required status check for the main ruleset.
  ci-ok:
    name: CI ok
    if: always()
    needs: [checks, release-build, app-tests, plugin-sdk-tests, appstore]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Not every CI job succeeded"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All CI jobs succeeded"
