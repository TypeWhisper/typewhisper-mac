name: Build DMG

on:
  # Pull requests cover feature branches; pushes only build maintained release branches.
  push:
    branches: ['release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  SCHEME: TypeWhisper
  PROJECT: TypeWhisper.xcodeproj
  XCODE_VERSION: "27.1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit's first parent is the base branch.
          fetch-depth: 2

      - name: Check whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD

      - name: Run script and policy checks
        run: bash scripts/ci-checks.sh

      - name: Check dependency coverage
        run: |
          ruby scripts/dependency_coverage.rb check
          ruby scripts/test_dependency_coverage.rb

  # Pull requests that leave the Plugin SDK package alone skip its macOS test job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugin_sdk: ${{ steps.diff.outputs.plugin_sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit's first parent is the base branch.
          fetch-depth: 2

      - name: Detect changed areas
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          plugin_sdk=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # A pathspec also catches files renamed out of the package; exit 1 means changed.
            status=0
            git diff --quiet HEAD^1 HEAD -- TypeWhisperPluginSDK/ .github/workflows/build.yml || status=$?
            case "$status" in
              0) plugin_sdk=false ;;
              1) ;;
              *) echo "::error::git diff failed with exit code $status"; exit "$status" ;;
            esac
          fi
          echo "plugin_sdk=$plugin_sdk" | tee -a "$GITHUB_OUTPUT"

  release-build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure Metal toolchain
        run: bash scripts/ensure_metal_toolchain.sh

      - name: Restore Swift package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if xcodebuild -resolvePackageDependencies \
              -project $PROJECT \
              -scheme $SCHEME \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Verify Release Check Scripts
        run: |
          bash scripts/check_release_binary_instrumentation.sh --self-test
          bash scripts/check_release_signing.sh --self-test

      # Pull requests build only the arm64 slice. Release branches, manual runs and
      # the nightly release build stay universal and also compile the x86_64 slice.
      - name: Build App
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          arch_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            arch_args=(ARCHS=arm64)
          fi
          xcodebuild -skipPackagePluginValidation -project $PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination 'generic/platform=macOS' \
            ENABLE_CODE_COVERAGE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${arch_args[@]}" | tee build.log

      - name: Check First-Party Warnings
        run: bash scripts/check_first_party_warnings.sh build.log

      - name: Check Release Binary Instrumentation
        run: bash scripts/check_release_binary_instrumentation.sh build/Build/Products/Release/TypeWhisper.app/Contents/MacOS/typewhisper-cli

      - name: Install dmgbuild
        run: |
          VENV_DIR="${RUNNER_TEMP}/dmgbuild-venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install dmgbuild
          echo "$VENV_DIR/bin" >> $GITHUB_PATH

      - name: Create DMG
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_NAME="TypeWhisper"
          DMG_NAME="TypeWhisper-${SHORT_SHA}.dmg"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DMG_NAME="TypeWhisper-${SHORT_SHA}-arm64.dmg"
          fi
          APP_PATH="build/Build/Products/Release/TypeWhisper.app"
          SETTINGS="${GITHUB_WORKSPACE}/.github/dmgbuild-settings.py"
          BACKGROUND="${GITHUB_WORKSPACE}/.github/dmg-background.png"

          dmgbuild -s "$SETTINGS" \
            -D app="$APP_NAME" \
            -D app_path="$APP_PATH" \
            -D background="$BACKGROUND" \
            "$APP_NAME" \
            "build/${DMG_NAME}"

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TypeWhisper-DMG
          path: build/TypeWhisper-*.dmg
          retention-days: 14

  app-tests:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure Metal toolchain
        run: bash scripts/ensure_metal_toolchain.sh

      # The nightly release workflow seeds this cache on main. Caches saved here would
      # be scoped to this pull request and unreachable for every other one.
      - name: Restore Swift package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if xcodebuild -resolvePackageDependencies \
              -project $PROJECT \
              -scheme $SCHEME \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      # The test host has the installed app's bundle identifier; the tests must not
      # change that app's preferences.
      - name: Snapshot App Preferences
        id: app-preferences-snapshot
        run: python3 scripts/check_test_host_preferences.py snapshot "$RUNNER_TEMP/app-preferences.json"

      - name: Run App Tests
        run: |
          set -o pipefail
          xcodebuild test -skipPackagePluginValidation -project $PROJECT \
            -scheme $SCHEME \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      # Screenshot runs from a checkout use the same Debug build and bundle identifier.
      - name: Check a Screenshot Run Leaves App Preferences Unchanged
        run: |
          set -o pipefail
          app="$(xcodebuild -project $PROJECT -scheme $SCHEME \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation -showBuildSettings -json 2>/dev/null \
            | python3 -c 'import json,sys; s=next(t["buildSettings"] for t in json.load(sys.stdin) if t["target"]=="TypeWhisper"); print(s["BUILT_PRODUCTS_DIR"]+"/"+s["FULL_PRODUCT_NAME"])')"
          python3 scripts/check_test_host_preferences.py screenshot-run "$app"

      # Also after failing tests, which can have written preferences before they failed.
      - name: Check App Preferences Are Unchanged
        if: always() && steps.app-preferences-snapshot.outcome == 'success'
        run: python3 scripts/check_test_host_preferences.py verify "$RUNNER_TEMP/app-preferences.json"

      - name: Check First-Party Warnings
        run: bash scripts/check_first_party_warnings.sh test.log

  plugin-sdk-tests:
    needs: changes
    if: needs.changes.outputs.plugin_sdk == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure Metal toolchain
        run: bash scripts/ensure_metal_toolchain.sh

      - name: Run Plugin SDK Tests
        run: swift test --package-path TypeWhisperPluginSDK

  # Mac App Store edition: compile check of the APPSTORE build with bundled plugins.
  # A Debug arm64 build keeps pull requests fast; the nightly TestFlight workflow
  # builds the universal Release binary and audits it. See docs/appstore/README.md.
  appstore:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPSTORE_DERIVED_DATA: build/appstore
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure Metal toolchain
        run: bash scripts/ensure_metal_toolchain.sh

      - name: Install XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate App Store project
        run: scripts/appstore/generate_project.sh

      # No package cache: nothing on main seeds one, so every pull request saved its
      # own 1.2 GB copy, and builds with a cache hit were not faster.
      - name: Build App Store app (Debug, arm64, unsigned)
        run: |
          mkdir -p build
          if ! xcodebuild build \
            -project TypeWhisperAppStore.xcodeproj \
            -scheme TypeWhisperAppStore \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$APPSTORE_DERIVED_DATA" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/appstore-xcodebuild.log 2>&1; then
            grep -E ' error: ' build/appstore-xcodebuild.log | sort -u | head -50
            tail -n 40 build/appstore-xcodebuild.log
            exit 1
          fi
          tail -n 3 build/appstore-xcodebuild.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appstore-xcodebuild-log
          path: build/appstore-xcodebuild.log
          retention-days: 7

  # Single required status check for the main ruleset.
  ci-ok:
    name: CI ok
    if: always()
    needs: [checks, changes, release-build, app-tests, plugin-sdk-tests, appstore]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # plugin-sdk-tests may be skipped only when the changes job ruled it out.
          failed="$(jq -r '
            (.changes.outputs.plugin_sdk == "false") as $sdk_unchanged
            | to_entries[]
            | select(.value.result != "success")
            | select((.key == "plugin-sdk-tests" and .value.result == "skipped" and $sdk_unchanged) | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Not every CI job succeeded"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All CI jobs succeeded"
