name: Fetch Notarization Log

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Apple notarization submission ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    # Runs started by SeoFood from this repository use the self-hosted Mac mini
    # while the MAC_MINI_RUNNER variable is "on"; everything else uses macos-latest.
    runs-on: ${{ (vars.MAC_MINI_RUNNER == 'on' && github.actor == 'SeoFood' && github.triggering_actor == 'SeoFood' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'seofood-mac-mini' || 'macos-latest' }}
    steps:
      - name: Fetch Notarization Log
        env:
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
