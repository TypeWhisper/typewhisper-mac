name: CodeQL

concurrency:
  # Keep scheduled and manual full scans independent of branch pushes and PRs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    tags:
      - "v*"
      - "!v*-daily*"
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: "26 3 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

env:
  SCHEME: TypeWhisper
  PROJECT: TypeWhisper.xcodeproj

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-26.04
            timeout-minutes: 10
          - language: python
            build-mode: none
            runner: ubuntu-26.04
            timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Full scans of every target run nightly, on non-daily release tags and on manual
  # dispatch. Pull requests and branch pushes keep the lightweight Actions and
  # Python analyses. See docs/codeql-swift.md.
  analyze-swift:
    name: Analyze (swift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # Intel on purpose: the CodeQL tracer and Swift extractor are x86_64, so on
    # Apple Silicon the traced build runs under Rosetta and each new runner first
    # translates the Xcode tools and the extractor (11-25 minutes per run). On
    # macos-26-intel a single-plugin pull request takes 12 minutes instead of
    # 22-35. See docs/codeql-swift.md.
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Package checkouts only, never compiled artifacts: every Swift file must be
      # compiled under CodeQL tracing to be extracted.
      - name: Restore Swift package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('TypeWhisper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      # Resolve before CodeQL initialization; the traced build must not fetch or
      # resolve packages again. The project has one package graph for all targets.
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if xcodebuild -resolvePackageDependencies \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            echo "Package resolution failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Verify Metal toolchain
        run: |
          if ! xcrun metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
          xcrun metal -v

      # Under CodeQL tracing, the `metal` stub in Xcode's default toolchain reports a
      # missing Metal Toolchain, while the downloaded toolchain's `metal` works. A
      # one-tool toolchain that forwards to it lets the MLX plugins build.
      - name: Route Metal compiles to the downloaded Metal toolchain
        id: metal-toolchain
        run: |
          metal="$(xcrun --find metal)"
          toolchain="$HOME/Library/Developer/Toolchains/CodeQLMetal.xctoolchain"
          identifier="com.typewhisper.codeql-metal"
          mkdir -p "$toolchain/usr/bin"
          cat > "$toolchain/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>$identifier</string>
            <key>DisplayName</key>
            <string>CodeQL Metal</string>
            <key>CompatibilityVersion</key>
            <integer>2</integer>
          </dict>
          </plist>
          PLIST
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$metal" > "$toolchain/usr/bin/metal"
          chmod +x "$toolchain/usr/bin/metal"
          plutil -lint "$toolchain/Info.plist"
          cat "$toolchain/usr/bin/metal"
          echo "identifier=$identifier" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build Swift for CodeQL
        env:
          SOURCE_PACKAGES_DIR: ${{ runner.temp }}/SourcePackages
          TOOLCHAINS: ${{ steps.metal-toolchain.outputs.identifier }}
        run: |
          set -o pipefail
          bash scripts/codeql-build-swift.sh "$RUNNER_TEMP/codeql-build" | tee "$RUNNER_TEMP/codeql-swift-build.log"

      # Upload only after the coverage check, so a partial extraction cannot make
      # alerts in skipped files look fixed.
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"
          upload: never

      - name: Check Swift extraction coverage
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: python3 scripts/codeql_swift_coverage.py "$SARIF_DIR/swift.sarif"

      - name: Upload CodeQL Swift results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}/swift.sarif
          category: "/language:swift"

      - name: Upload CodeQL Swift diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-diagnostics
          path: |
            ${{ runner.temp }}/codeql-swift-build.log
            ${{ runner.temp }}/codeql_databases/log
            ${{ runner.temp }}/codeql_databases/swift/log
            ${{ runner.temp }}/codeql_databases/swift/diagnostic
            ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: ignore
          retention-days: 7
