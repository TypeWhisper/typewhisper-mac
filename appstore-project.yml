  TypeWhisperWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TypeWhisperWidgetExtension
        excludes:
          - Info.plist
          - TypeWhisperWidgetExtension.entitlements
      - path: TypeWhisperWidgetShared/WidgetData.swift
    settings:
      base:
        PRODUCT_NAME: TypeWhisperWidgetExtension
        # Shared with the iOS widget extension of the universal purchase record.
        PRODUCT_BUNDLE_IDENTIFIER: $(TYPEWHISPER_APPSTORE_BUNDLE_ID).widget
        PROVISIONING_PROFILE_SPECIFIER: "$(TW_APPSTORE_WIDGET_PROFILE)"
        INFOPLIST_FILE: TypeWhisperWidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TypeWhisper Widgets
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: TypeWhisperWidgetExtension/TypeWhisperWidgetExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  TypeWhisperTranscribeAction:
    type: app-extension
    platform: macOS
    sources:
      - path: TypeWhisperTranscribeAction
        excludes:
          - Info.plist
          - TypeWhisperTranscribeAction.entitlements
    settings:
      base:
        PRODUCT_NAME: TypeWhisperTranscribeAction
        PRODUCT_BUNDLE_IDENTIFIER: $(TYPEWHISPER_APPSTORE_BUNDLE_ID).transcribe-action
        PROVISIONING_PROFILE_SPECIFIER: "$(TW_APPSTORE_TRANSCRIBE_PROFILE)"
        INFOPLIST_FILE: TypeWhisperTranscribeAction/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TypeWhisperTranscribeAction/TypeWhisperTranscribeAction.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readonly
        SWIFT_STRICT_CONCURRENCY: targeted
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
